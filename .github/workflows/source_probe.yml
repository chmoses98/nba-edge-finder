name: source-probe
# TEMPORARY (never merged): a read-only probe of independent roster sources from a GitHub-hosted runner.
on:
  workflow_dispatch:
    inputs:
      samples:
        description: "unused"
        default: "1"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: projection-data
          path: archive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas
      - name: Roster confirmation probe
        working-directory: research/projection_foundation
        env:
          PYTHONPATH: .
        run: python roster_confirm_probe.py ../../archive
