name: source-probe
# TEMPORARY (not for merge): runs the read-only NBA roster audit and the activation check from a GitHub-hosted runner.
on:
  workflow_dispatch:
    inputs:
      samples:
        description: "unused"
        default: "1"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: projection-data
          path: archive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas
      - name: Roster audit
        working-directory: research/projection_foundation
        env:
          PYTHONPATH: .
        run: python -m nba.live.roster_audit --archive ../../archive --json /tmp/audit.json
      - name: Activation check with the audit as evidence
        working-directory: research/projection_foundation
        env:
          PYTHONPATH: .
        run: |
          python -m nba.live.activation_check --archive ../../archive --roster-audit /tmp/audit.json --json /tmp/act.json > /tmp/act.md
          grep -E "^## |^\| (A5|D3|D4|D5|D7)|^- " /tmp/act.md | cut -c1-1100
