name: exec-shadow-seal
# Issue #53 (owner direction on PR #54): SEALED PRE-TIP LEDGER of the executable T-60 shadow study. RESEARCH ONLY: no orders, no staking, no account access, no secrets.
#   * After each game's T-60 archive cut-off (+10 min for capture lag, measured p90 6 min / max 8 min) and at least 10 min before tip, evaluate the game with the frozen rules and
#     append an immutable seal (TRADE / NO_TRADE + reasons + inputs + hashes) to the `exec-shadow-seals` branch. This is the ONLY branch the workflow writes, and only through
#     nba.paper.ledger_remote (GitHub Git Data API: server-side commit time, fast-forward only, additions only). Nothing here runs `git push` or `git commit`.
#   * Post-game research joins settlements to that ledger and never recomputes a selection (nba.paper.exec_seal.evaluate).
#   * WHY A CHAIN AND NOT A 5-MINUTE CRON. This repository measured its own schedule delivery at ~4% (capture_worker.yml: 34 runs of 864 expected, gaps of 2-3 h). A seal window is
#     40 minutes, so a cron-driven sealer would miss most games. Like capture-worker / nba-ticker, one run owns the cadence (a poll every 90 s, ~280 minutes) and dispatches its
#     successor; cron is only the bootstrap. A delivered cron costs a ~15 s stdlib gate (no dependency install); the chain starts only when a seal window is open or opens within 6 h.
#   * Dead-man: nba-watchdog (the repo's ops monitor / `nba-ops-alert` issue) alerts when a window is open or imminent and no run of this workflow is alive, or when a window closed
#     with neither a seal nor a MISSED marker, or on any MISSED marker (nba.paper.seal_monitor).
#   * Only runs from the default branch can produce COUNTED seals (verified offline: code sha must be reachable from main). Pull-request runs and dry dispatches perform ONE
#     rehearsal iteration on a fixed past instant and publish nothing.
#   * Lanes: the same chain can seal a second, separately preregistered study (`t45`, own protocol / ledger branch / counts) - no extra scheduler. It is OFF in SEAL_LANES until approved.
#   * Does not touch the live ticker, capture worker, projection-foundation, the paper protocol, or any original archive.
on:
  schedule:
    # BOOTSTRAP ONLY (see above). Hours 12-03 UTC cover weekend-afternoon tips through late west-coast games; season months as in the other NBA workflows.
    - cron: "*/5 12-23,0-3 * 10-12,1-6 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "one rehearsal iteration; nothing is published or dispatched (default true for manual runs)"
        type: boolean
        default: true
      now:
        description: "dry run only: clock override (ISO, UTC); blank = a fixed rehearsal instant on real archived data"
        default: ""
  pull_request:
    paths:
      - ".github/workflows/exec-shadow-seal.yml"
      - "research/projection_foundation/nba/paper/exec_seal.py"
      - "research/projection_foundation/nba/paper/exec_shadow.py"
      - "research/projection_foundation/nba/paper/exec_shadow_config_v2.json"
      - "research/projection_foundation/nba/paper/exec_shadow_config_t45_v1.json"
      - "research/projection_foundation/nba/paper/seal_windows.py"
      - "research/projection_foundation/nba/paper/seal_chain.py"
      - "research/projection_foundation/nba/paper/seal_monitor.py"
      - "research/projection_foundation/nba/paper/ledger_remote.py"
      - "research/projection_foundation/scripts/exec_seal_ci.sh"

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

env:
  PF_DIR: research/projection_foundation
  PY: "3.13"
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  # Sealing lanes. `control` = the original strict T-60 study. `t45` = the separately preregistered T-45 availability study (exec_shadow_config_t45_v1.json; own ledger branch, own
  # evidence counts). Adding t45 to SEAL_LANES is the ACTIVATION step and needs the owner's approval; the rehearsal below exercises both lanes dry on real archived data.
  SEAL_LANES: "control"
  REHEARSAL_LANES: "control,t45"
  REHEARSAL_NOW: "2026-10-21T01:00:00Z"        # OKC@SAS window (opens 00:40Z, closes 01:20Z, tip 01:30Z) on real archived data: the dry iteration exercises the whole path

concurrency:
  # ONE live chain at a time (a delivered cron while the chain runs queues as its natural successor). Rehearsals never wait behind it.
  group: exec-shadow-seal-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.run_id)) || (github.event.inputs.dry_run == 'true' && format('dry-{0}', github.run_id)) || 'live' }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write        # used ONLY by nba.paper.ledger_remote (Git Data API, ledger layout only) via PUBLISH_TOKEN
      actions: write         # used ONLY to dispatch the successor
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_IN: ${{ github.event.inputs.dry_run }}
        run: |
          DRY=false
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = workflow_dispatch -a "${DRY_IN:-true}" = true ]; then DRY=true; fi
          # a counted seal can only come from the default branch
          if [ "$DRY" = false ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then DRY=true; echo "::notice::not the default branch: forcing dry run"; fi
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
      - name: Idle gate (standard library only, no install)
        id: gate
        env:
          DRY: ${{ steps.mode.outputs.dry }}
          NOW_IN: ${{ github.event.inputs.now }}
        run: |
          NOW=""
          LANES="$SEAL_LANES"
          if [ "$DRY" = true ]; then NOW="${NOW_IN:-$REHEARSAL_NOW}"; LANES="$REHEARSAL_LANES"; fi
          mkdir -p "$RUNNER_TEMP/work"
          bash $PF_DIR/scripts/exec_seal_ci.sh mount_context "$RUNNER_TEMP/work/m" $NOW
          ACTIVE=false
          for L in ${LANES//,/ }; do
            D="$RUNNER_TEMP/work/seals"; [ "$L" = control ] || D="$RUNNER_TEMP/work/seals_$L"
            if [ "$DRY" = true ]; then rm -rf "$D"; mkdir -p "$D"; git init -q "$D"
            else bash $PF_DIR/scripts/exec_seal_ci.sh mount_seals "$D" "$(python3 $PF_DIR/nba/paper/seal_windows.py branch --lane "$L")"; fi
            OUT=$(python3 $PF_DIR/nba/paper/seal_windows.py gate --lane "$L" --context "$RUNNER_TEMP/work/m/data-archive" --seals "$D" --horizon-h 6 ${NOW:+--now "$NOW"})
            echo "[$L] $(echo "$OUT" | tr '\n' ' ')"
            if echo "$OUT" | grep -q '^active=true'; then ACTIVE=true; fi
          done
          if [ "$DRY" = true ]; then ACTIVE=true; fi     # rehearsals always run their one iteration
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "lanes=$LANES" >> "$GITHUB_OUTPUT"
          echo "now=$NOW" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && steps.gate.outputs.active == 'true' }}
        with: { python-version: "${{ env.PY }}", cache: pip }
      - name: Install (compute stack only; once per chain, not per poll)
        if: ${{ !cancelled() && steps.gate.outputs.active == 'true' }}
        run: |
          pip install -q numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 pyarrow==26.0.0 pydantic==2.13.5 httpx==0.28.1 pyyaml==6.0.1 orjson==3.13.0 pypdf==6.17.0
          pip install -q -e . --no-deps
      - name: History without blobs (the protocol file's commit time and code reachability are read from history)
        if: ${{ !cancelled() && steps.gate.outputs.active == 'true' }}
        run: git fetch --filter=blob:none --unshallow origin || git fetch --filter=blob:none origin
      - name: Seal chain
        id: chain
        if: ${{ !cancelled() && steps.gate.outputs.active == 'true' }}
        working-directory: ${{ github.workspace }}
        env:
          DRY: ${{ steps.mode.outputs.dry }}
          NOW: ${{ steps.gate.outputs.now }}
          LANES: ${{ steps.gate.outputs.lanes }}
          PUBLISH_TOKEN: ${{ github.token }}          # reaches only the publisher and the successor dispatch (nba.paper.seal_chain)
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 $PF_DIR/nba/paper/seal_chain.py --work "$RUNNER_TEMP/work" --repo-root "$GITHUB_WORKSPACE" --repo "$GITHUB_REPOSITORY" \
            --default-branch "$DEFAULT_BRANCH" --lanes "$LANES" $([ "$DRY" = true ] && echo "--dry-run ${NOW:+--now $NOW}") 2>&1 | tee "$RUNNER_TEMP/work/chain.log"
      - name: Evidence (reports; the ledger commits carry the server timestamps)
        if: ${{ always() && steps.gate.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: exec-shadow-seal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/work/chain.log
            ${{ runner.temp }}/work/seal_report*.json
            ${{ runner.temp }}/work/publish*.json
          retention-days: 90
          if-no-files-found: ignore
