name: NBA injury lineup holdout
on:
  pull_request:
    paths:
      - "src/nba_edge/research/lineup_impact.py"
      - "src/nba_edge/features/build.py"
      - "src/nba_edge/sim/**"
      - "research/projection_foundation/nba/project.py"
      - "research/projection_foundation/nba/live/participation.py"
      - "research/projection_foundation/tests/test_nba_live.py"
      - "scripts/injury_lineup_holdout.py"
      - ".github/workflows/injury-lineup-holdout.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: injury-holdout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  paired-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]" scikit-learn
      - name: Verify official OUT cannot consume live projection minutes
        run: PYTHONPATH=research/projection_foundation:src pytest -q research/projection_foundation/tests/test_nba_live.py -k confirmed_out_zeroes
      - name: Run frozen-season oracle ceiling test
        run: |
          python scripts/injury_lineup_holdout.py --max-games 500 --out /tmp/injury_lineup_holdout.json
      - name: Preserve full paired outcome table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: injury-lineup-holdout
          path: /tmp/injury_lineup_holdout.json
          if-no-files-found: warn
