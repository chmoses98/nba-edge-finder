name: history-pull
# TEMPORARILY REPLACED ON THIS DISPOSABLE BRANCH with the granular-source probe.
# workflow_dispatch resolves the workflow by a file on the DEFAULT branch (proved: E0), so a probe
# that only exists on a feature branch cannot be dispatched under its own name. It runs under a
# name main already publishes, with `ref` pointing here, and main is never touched.
on:
  workflow_dispatch:
    inputs:
      seasons:
        default: "unused"
      what:
        default: "unused"
permissions:
  contents: read
concurrency:
  # Deliberately NOT the chainlab group: this must be able to run while a chainlab experiment holds
  # that one, and queueing here would cancel a pending chainlab run (E2).
  group: source-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The probe now imports the project's own HTTP client on purpose: probing with a different
      # client measures the probe rather than the source (the first run proved that the hard way).
      - run: pip install -e .
      - name: Probe granular data sources from a GitHub-hosted runner
        run: python scripts/probe_granular_sources.py
