name: NBA injury correctness (point-in-time)

# Fast, independent correctness gate: do not make deterministic OUT handling
# wait behind the 30+ minute Projection Foundation full-chain replay.
on:
  push:
    branches:
      - main
      - fix/nba-hard-out-production-pipeline
    paths:
      - "research/projection_foundation/**"
      - "tests/fixtures/injury_reports/**"
      - ".github/workflows/nba-injury-correctness.yml"
  pull_request:
    paths:
      - "research/projection_foundation/**"
      - "tests/fixtures/injury_reports/**"
      - ".github/workflows/nba-injury-correctness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  injury-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen Projection Foundation dependencies
        run: |
          python -m pip install -q numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 scikit-learn==1.9.1 lightgbm==4.7.0 pyarrow==26.0.0 pytest==9.1.1 pyyaml==6.0.1 httpx==0.28.1 pypdf==6.17.0 pydantic==2.13.5 orjson==3.13.0
          python -m pip install -q -e . --no-deps
      - name: Official archived PDF, calibration, hard OUT, reconciliation, DNP archival
        working-directory: research/projection_foundation
        run: |
          python -m pytest tests/test_nba_live.py -q -p no:warnings -x -k "confirmed_out or official_report_to_observations_and_resolution or calibrated_p_play_orders_by_designation or participation_precedence_and_conflicts or reconciliation_normalises_incoherent_roster_and_leaves_coherent_ones"
