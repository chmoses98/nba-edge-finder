name: nba-shadow-pure
# Prospective PURE shadow collection for NBA player stats (research only: no authority, no staking,
# no publication). Champion = frozen NBA_BASELINE_2026_PRESEASON_V1 simulator (rotation mixture,
# impact_ppp = 0, participation proxy); baseline = EWM5_BASELINE_W1. See docs/research/SHADOW_PURE_NBA.md.
#
# Data lands on its own append-only branch (SHADOW_BRANCH), never on main and never on data-archive.
# The capture archive (data-archive) is fetched READ-ONLY for market listings; this job never pushes it.
# Own concurrency group: one writer to SHADOW_BRANCH, and it cannot race the conductor/worker group.
#
# schedule only fires from the default branch, i.e. after merge. Cron delivery on this repository has
# been measured as unreliable (docs/research/CAPTURE_ARCHITECTURE.md), so every run captures whatever
# slot is due and fetches any missing outcomes; a slot nobody captured is recorded as missed, never
# back-filled.
on:
  schedule:
    - cron: "13 14 * * *"       # morning slot (~10:13 ET in EDT), outcomes, evaluation
    - cron: "43 15 * * *"       # morning retry
    - cron: "*/15 15-23 * * *"  # pretip (T-60m) sweeps: tips ~16:00-03:30 UTC (weekend/holiday afternoon tips included)
    - cron: "*/15 0-3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (throwaway store, no commit) | live (commit to the shadow branch)"
        default: "dry-run"
      replay_date:
        description: "dry-run only: ET date to replay (blank = most recent date with completed games)"
        default: ""
  # PR dry run is LABEL-GATED (add the `shadow-dry-run` label): the account's concurrent-job limit is
  # shared with production, and an `opened`/`synchronize` trigger would always run alongside ci.yml.
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: nba-shadow-pure-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

env:
  SHADOW_BRANCH: nba-shadow-pure
  ARCHIVE_BRANCH: data-archive
  OMP_NUM_THREADS: "1"

jobs:
  dry-run:
    if: (github.event_name == 'pull_request' && github.event.label.name == 'shadow-dry-run') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests for the collector
        run: pytest -q tests/test_shadow_pure.py tests/test_shadow_pure_immutability.py
      - name: Fetch the capture archive read-only (market listings)
        run: |
          set -uo pipefail
          if git fetch -q origin "$ARCHIVE_BRANCH" --depth=1; then
            git worktree add -q --detach data/archive "origin/$ARCHIVE_BRANCH"
          else
            echo "::warning::archive branch unavailable; market listings will be recorded as ARCHIVE_UNAVAILABLE"
          fi
      - name: Dry run (live ESPN fetch, build, validate; nothing committed)
        env:
          REPLAY_DATE: ${{ inputs.replay_date }}
        run: |
          set -uo pipefail
          args=(dry-run --out shadow_dry)
          [ -d data/archive ] && args+=(--archive data/archive)
          [ -n "${REPLAY_DATE:-}" ] && args+=(--replay-date "$REPLAY_DATE")
          python scripts/nba_shadow_pure.py "${args[@]}"
      - name: Upload dry-run store
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-shadow-pure-dry-run-${{ github.run_id }}
          path: shadow_dry
          retention-days: 14

  live:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Mount the shadow branch (append-only store) and the archive (read-only)
        run: |
          set -uo pipefail
          git config --global user.name "nba-edge-bot"
          git config --global user.email "nba-edge-bot@users.noreply.github.com"
          if git fetch -q origin "$SHADOW_BRANCH"; then
            git worktree add -q data/shadow_pure/nba "origin/$SHADOW_BRANCH"
            (cd data/shadow_pure/nba && git checkout -q -B "$SHADOW_BRANCH")
          else
            git worktree add -q --orphan -b "$SHADOW_BRANCH" data/shadow_pure/nba
            (cd data/shadow_pure/nba && printf '# NBA PURE shadow store (append-only)\nSee docs/research/SHADOW_PURE_NBA.md on main.\n' > README.md \
              && git add README.md && git commit -qm "init NBA PURE shadow store")
            git update-ref "refs/remotes/origin/$SHADOW_BRANCH" "$(git -C data/shadow_pure/nba rev-parse HEAD)"
          fi
          git fetch -q origin "$ARCHIVE_BRANCH" --depth=1 && git worktree add -q --detach data/archive "origin/$ARCHIVE_BRANCH" || echo "::warning::archive unavailable"
      - name: Outcomes, capture, evaluation
        run: |
          set -uo pipefail
          A=(); [ -d data/archive ] && A=(--archive data/archive)
          python scripts/nba_shadow_pure.py outcomes --store data/shadow_pure/nba --back 3 --include-preseason
          python scripts/nba_shadow_pure.py capture  --store data/shadow_pure/nba --slot auto --include-preseason "${A[@]}"
          python scripts/nba_shadow_pure.py evaluate --store data/shadow_pure/nba "${A[@]}"
      - name: Verify immutability, hash chain and gate validity before pushing
        run: python scripts/nba_shadow_pure.py verify --store data/shadow_pure/nba --base-ref "origin/$SHADOW_BRANCH" --gate
      - name: Commit and push the shadow branch
        run: |
          set -uo pipefail
          cd data/shadow_pure/nba
          git add -A
          if git diff --cached --quiet; then
            # An unpushed commit (the orphan init commit on the very first run) must still be published:
            # until it is, the branch does not exist on origin and later runs re-create it.
            if git rev-parse -q --verify "refs/remotes/origin/$SHADOW_BRANCH" >/dev/null \
               && [ "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/$SHADOW_BRANCH")" ] \
               && git ls-remote --exit-code --heads origin "$SHADOW_BRANCH" >/dev/null 2>&1; then
              echo "nothing to commit"; exit 0
            fi
          else
            git commit -qm "nba shadow pure: run ${{ github.run_id }}"
          fi
          for i in 1 2 3 4 5; do
            if git push -q origin "HEAD:$SHADOW_BRANCH"; then echo "pushed on attempt $i"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch -q origin "$SHADOW_BRANCH" || true
            # one writer (concurrency group) means a rejected push is unexpected; never merge the
            # append-only logs blindly -- rebase cleanly or fail and preserve the run's files.
            git rebase -q "origin/$SHADOW_BRANCH" || { git rebase --abort 2>/dev/null || true; echo "::error::rebase conflict"; exit 1; }
            sleep $((2**i))
          done
          echo "::error::push failed after 5 attempts"; exit 1
      - name: Preserve the store if the push failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nba-shadow-pure-store-${{ github.run_id }}
          path: data/shadow_pure/nba
          retention-days: 14
