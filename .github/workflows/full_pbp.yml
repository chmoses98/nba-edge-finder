name: full-pbp-backfill
# Research data backfill: persist the FULL ESPN play-by-play (every event type, not only shots) for a
# bounded window, reconstruct five-man lineups from it, and certify (or not) each game.
#
# Runs on a GitHub-hosted runner because site.api.espn.com is denied by the development container's
# egress policy. Additive only: writes data/history/espn_pbp/ and docs/research/lineup_pbp/, never the
# shot-event or box-score datasets.
#
# Triggers:
#   pull_request (paths-filtered to this lane's files) -- the PR branch IS the place the data lands;
#     the job commits back to the head branch. GITHUB_TOKEN pushes do not retrigger workflows.
#   workflow_dispatch -- only resolvable once this file is on the default branch; on the default branch
#     the job refuses to push (same rule as shot-events-pull) and leaves the data in the artifact.
# Idempotent and time-budgeted (job <= 30 min): games already ingested are skipped, so re-running the
# workflow continues the backfill in chunks, one run at a time.
on:
  pull_request:
    paths:
      - ".github/workflows/full_pbp.yml"
      - "src/nba_edge/pbp/**"
      - "scripts/pbp_backfill.py"
      - "scripts/probe_full_pbp.py"
      - "scripts/lineup_certify.py"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma list of seasons (YYYY-YY)"
        default: "2025-26,2024-25"
      max_games:
        description: "Cap on NEW games per season per run (0 = no cap)"
        default: "0"

permissions:
  contents: write

concurrency:
  # Own group: must never queue behind, or supersede, the capture worker / conductor.
  group: full-pbp-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  SEASONS: ${{ inputs.seasons || '2025-26,2024-25' }}
  MAX_GAMES: ${{ inputs.max_games || '0' }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # the PR's head branch, not the merge commit, so the data can be committed back to it
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Backfill full play-by-play (resumable; skips games already ingested)
        env:
          NBA_EDGE_LOG_LEVEL: INFO
        run: python scripts/pbp_backfill.py --seasons "$SEASONS" --max-games "$MAX_GAMES" --max-minutes 17
      - name: Reconstruct lineups and certify each game
        if: always()
        run: python scripts/lineup_certify.py --seasons "$SEASONS"
      - name: Size guard (added data must stay small)
        if: always()
        run: |
          du -ch data/history/espn_pbp/* | tail -20
          kb=$(du -sk data/history/espn_pbp | cut -f1)
          echo "espn_pbp total: ${kb} KB"
          if [ "$kb" -gt 61440 ]; then echo "::error::espn_pbp exceeds 60 MB (${kb} KB)"; exit 1; fi
      - name: Commit data + certification back to the PR branch
        if: always()
        run: |
          git config user.name "nba-edge-bot"
          git config user.email "nba-edge-bot@users.noreply.github.com"
          git add data/history/espn_pbp docs/research/lineup_pbp 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "full-pbp: ESPN play-by-play backfill + lineup certification ($SEASONS) (run ${{ github.run_id }})"
          BR="${{ github.head_ref || github.ref_name }}"
          if [ "$BR" = "${DEFAULT_BRANCH}" ]; then
            echo "::warning title=Refusing to push to the default branch::data is in this run's artifact"
            exit 0
          fi
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "$BR" && git push origin HEAD:"$BR" && exit 0
            sleep $((2 ** i))
          done
          exit 1
      - name: Preserve outputs as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pbp
          path: |
            data/history/espn_pbp/
            docs/research/lineup_pbp/
          if-no-files-found: ignore
