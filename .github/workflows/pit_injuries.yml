name: pit-injury-reports
# Point-in-time injury / availability records (research data). See docs/research/PIT_AVAILABILITY.md.
on:
  pull_request:
    paths:
      - ".github/workflows/pit_injuries.yml"
      - "src/nba_edge/availability/**"
      - "scripts/probe_injury_reports.py"
      - "scripts/pit_injury_backfill.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pit-injuries-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Probe official injury-report archive + ESPN injuries (read-only)
        run: python scripts/probe_injury_reports.py

  fixtures:
    # Commits a handful of real official report PDFs as parser test fixtures (the dev container cannot
    # reach ak-static.cms.nba.com). Skips any that already exist.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Download fixture PDFs
        run: |
          mkdir -p tests/fixtures/injury_reports
          cd tests/fixtures/injury_reports
          for spec in "2026-01-15:05_30PM" "2026-01-15:01_00PM,12_30PM,01_30PM,11_30AM" "2025-11-29:05_30PM,06_00PM,05_00PM,07_30PM" "2026-05-10:12_30PM,01_00PM,02_00PM,11_30AM"; do
            d="${spec%%:*}"; slots="${spec#*:}"
            for t in ${slots//,/ }; do
              f="Injury-Report_${d}_${t}.pdf"
              [ -f "$f" ] && break
              code=$(curl -sS -o "$f" -w "%{http_code}" "https://ak-static.cms.nba.com/referee/injury/$f" || echo 000)
              if [ "$code" = "200" ]; then echo "got $f"; break; else rm -f "$f"; echo "miss $f ($code)"; fi
            done
          done
          ls -la
      - name: Commit fixtures
        run: |
          git config user.name "nba-edge-bot"
          git config user.email "nba-edge-bot@users.noreply.github.com"
          git add tests/fixtures/injury_reports
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "pit-availability: official injury-report PDF test fixtures (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.head_ref }}" && git push origin HEAD:"${{ github.head_ref }}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
