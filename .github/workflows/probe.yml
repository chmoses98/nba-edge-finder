name: probe-and-discover
# TEMPORARILY REPLACED ON THIS DISPOSABLE BRANCH with the chainlab experiment rig.
#
# Why this filename: `workflow_dispatch` resolves the workflow by a file that must exist on the
# DEFAULT branch (proved: dispatching a branch-only chainlab.yml returns 404 while the same token
# dispatches conductor.yml with 204). The executed CONTENT, however, comes from the `ref`. So the
# rig runs from this branch under a name main already publishes, and main is never touched.
#
# Parameters are packed into probe.yml's existing input names so the dispatch validates whichever
# branch's input schema GitHub checks against:
#   statuses  = MODE:GROUP:TAG:HOLD_SECONDS      (also serves as the concurrency group key)
#   max_pages = DEPTH:MAX_DEPTH
on:
  workflow_dispatch:
    inputs:
      statuses:
        description: "MODE:GROUP:TAG:HOLD_SECONDS"
        default: "probe:g0:untagged:0"
      max_pages:
        description: "DEPTH:MAX_DEPTH"
        default: "1:3"

permissions:
  contents: read
  actions: write

concurrency:
  # Keyed on the packed string, so every link of one experiment's chain contends for one group --
  # which is precisely the single-writer property the capture worker needs, tested for real.
  group: chainlab-${{ inputs.statuses }}
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Parse and report
        id: p
        run: |
          IFS=':' read -r MODE GROUP TAG HOLD <<< "${{ inputs.statuses }}"
          IFS=':' read -r DEPTH MAXD <<< "${{ inputs.max_pages }}"
          echo "mode=$MODE"  >> "$GITHUB_OUTPUT"
          echo "hold=$HOLD"  >> "$GITHUB_OUTPUT"
          echo "depth=$DEPTH" >> "$GITHUB_OUTPUT"
          echo "maxd=$MAXD"  >> "$GITHUB_OUTPUT"
          echo "LAB tag=$TAG mode=$MODE group=$GROUP depth=$DEPTH/$MAXD hold=${HOLD}s"
          echo "LAB run_id=${{ github.run_id }} ref=${{ github.ref_name }} started=$(date -u +%s)"
          echo "LAB runner=$(uname -srm) nproc=$(nproc)"

      - name: Token at t=0
        run: |
          echo "LAB token_t0_http=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            https://api.github.com/repos/${{ github.repository }})"

      # Before the dispatch on purpose: the parent must still hold the concurrency group when the
      # successor is queued, which is the real ordering a capture worker produces.
      - name: Hold the runner and the concurrency group
        if: steps.p.outputs.hold != '0'
        run: |
          t0=$(date -u +%s); end=$(( t0 + ${{ steps.p.outputs.hold }} ))
          while [ "$(date -u +%s)" -lt "$end" ]; do
            sleep 30
            echo "LAB token_alive elapsed=$(( $(date -u +%s) - t0 ))s http=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'Authorization: Bearer ${{ github.token }}' \
              https://api.github.com/repos/${{ github.repository }})"
          done
          echo "LAB hold_done elapsed=$(( $(date -u +%s) - t0 ))s"

      - name: Die before dispatching a successor
        if: steps.p.outputs.mode == 'crash'
        run: |
          echo "LAB crashing deliberately; no successor dispatched"
          exit 1

      - name: Dispatch successor
        if: steps.p.outputs.mode == 'chain' || steps.p.outputs.mode == 'hold'
        run: |
          set -uo pipefail
          next=$(( ${{ steps.p.outputs.depth }} + 1 ))
          if [ "$next" -gt "${{ steps.p.outputs.maxd }}" ]; then
            echo "LAB chain_end depth=${{ steps.p.outputs.depth }} hit max_depth"; exit 0
          fi
          body=$(printf '{"ref":"%s","inputs":{"statuses":"%s","max_pages":"%s:%s"}}' \
            "${{ github.ref_name }}" "${{ inputs.statuses }}" "$next" "${{ steps.p.outputs.maxd }}")
          code=$(curl -sS -o /tmp/d.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/probe.yml/dispatches" \
            -d "$body")
          echo "LAB dispatch_http=$code depth=${{ steps.p.outputs.depth }}->$next at $(date -u +%s)"
          cat /tmp/d.json 2>/dev/null || true
          # 204 only means ACCEPTED. Whether a run is actually created is the recursion-suppression
          # question, and is answered by looking for the successor run -- never by this status code.
          [ "$code" = "204" ] || { echo "LAB dispatch_REJECTED"; exit 1; }

      - name: Token at end
        if: always()
        run: |
          echo "LAB token_tEnd_http=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            https://api.github.com/repos/${{ github.repository }}) at $(date -u +%s)"
