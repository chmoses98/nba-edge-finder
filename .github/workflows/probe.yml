name: probe-and-discover
# Manual: probe data sources + discover the Kalshi NBA universe from a network-capable runner.
# Commits the small catalog/probe outputs back to the branch it ran on; raw dumps go to a run artifact.
on:
  workflow_dispatch:
    inputs:
      statuses:
        description: "Comma list of market statuses to scan"
        default: "unopened,open,closed,settled"
      max_pages:
        description: "Max 1000-market pages per series/status"
        default: "40"
  push:
    paths:
      - ".trigger/probe"

env:
  STATUSES: ${{ inputs.statuses || 'unopened,open,closed,settled' }}
  MAX_PAGES: ${{ inputs.max_pages || '40' }}

permissions:
  contents: write

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Probe data sources
        run: python scripts/probe_sources.py out/probe
      - name: Discover Kalshi NBA universe
        env:
          NBA_EDGE_LOG_LEVEL: INFO
        run: nba discover --out data/catalog --raw-dir out/raw/kalshi --statuses "$STATUSES" --max-pages "$MAX_PAGES"
      - name: Upload raw dumps
        uses: actions/upload-artifact@v4
        with:
          name: probe-raw-${{ github.run_id }}
          path: out/
          retention-days: 30
      - name: Commit catalog + probe results
        run: |
          mkdir -p docs/probe
          cp out/probe/probe_results.json out/probe/probe_results.md docs/probe/
          git config user.name "nba-edge-bot"
          git config user.email "nba-edge-bot@users.noreply.github.com"
          git add data/catalog docs/probe
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "catalog: discovery + probe results (run ${{ github.run_id }})"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
