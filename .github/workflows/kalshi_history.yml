name: kalshi-history
# Manual: pull settled Kalshi NBA markets (+ hourly candlesticks) from the historical API on a
# network-capable runner. Small outputs (manifest, team-uuid map, per-series settled markets) are committed
# back to the branch it ran on; candlesticks can be large and go to a run artifact only.
on:
  workflow_dispatch:
    inputs:
      series:
        description: "Comma list of series tickers"
        default: "KXNBAGAME,KXNBASPREAD,KXNBATOTAL,KXNBATEAMTOTAL,KXNBAPTS,KXNBAREB,KXNBAAST,KXNBA3PT,KXNBAPRA,KXNBA1HSPREAD,KXNBA1HTOTAL,KXNBA1HWINNER,KXNBAWINS"
      min_close:
        description: "Earliest close date (YYYY-MM-DD)"
        default: "2025-10-01"
      max_close:
        description: "Latest close date (YYYY-MM-DD)"
        default: "2026-07-01"
      max_candle_markets:
        description: "Hard cap on candle fetches this run"
        default: "3000"
      sample_games:
        description: "Pull candles for every market of N sampled games (0 = global priority budget)"
        default: "0"
  push:
    paths:
      - ".trigger/kalshi_history"

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  SERIES: ${{ inputs.series || 'KXNBAGAME,KXNBASPREAD,KXNBATOTAL,KXNBATEAMTOTAL,KXNBAPTS,KXNBAREB,KXNBAAST,KXNBA3PT,KXNBAPRA,KXNBA1HSPREAD,KXNBA1HTOTAL,KXNBA1HWINNER,KXNBAWINS' }}
  MIN_CLOSE: ${{ inputs.min_close || '2025-10-01' }}
  MAX_CLOSE: ${{ inputs.max_close || '2026-07-01' }}
  MAX_CANDLE_MARKETS: ${{ inputs.max_candle_markets || '3000' }}
  SAMPLE_GAMES: ${{ inputs.sample_games || '0' }}

permissions:
  contents: write

concurrency:
  group: kalshi-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kalshi-history:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Apply overrides from .trigger/kalshi_history (KEY=VALUE lines)
        run: |
          # Push-triggered runs cannot pass workflow inputs, so the trigger file carries them. Only these five
          # keys are honoured and each value is validated, so file contents can never become shell code.
          f=.trigger/kalshi_history
          [ -f "$f" ] || exit 0
          for key in SERIES MIN_CLOSE MAX_CLOSE MAX_CANDLE_MARKETS SAMPLE_GAMES; do
            v="$(grep -E "^${key}=" "$f" | tail -1 | cut -d= -f2- | tr -d '[:space:]')" || true
            [ -n "$v" ] || continue
            case "$key" in
              SERIES) echo "$v" | grep -Eq '^[A-Z0-9,]+$' || { echo "bad SERIES; ignored"; continue; } ;;
              MIN_CLOSE|MAX_CLOSE) echo "$v" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "bad $key; ignored"; continue; } ;;
              MAX_CANDLE_MARKETS|SAMPLE_GAMES) echo "$v" | grep -Eq '^[0-9]{1,7}$' || { echo "bad $key; ignored"; continue; } ;;
            esac
            echo "$key=$v" >> "$GITHUB_ENV"
            echo "override $key=$v"
          done
      - name: Pull Kalshi historical markets + candlesticks
        env:
          NBA_EDGE_LOG_LEVEL: INFO
        run: >
          nba kalshi-history --out data/history --candles
          --series "$SERIES" --min-close "$MIN_CLOSE" --max-close "$MAX_CLOSE"
          --max-candle-markets "$MAX_CANDLE_MARKETS" --sample-games "$SAMPLE_GAMES"
      - name: Upload full pull (incl. candlesticks)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-history-${{ github.run_id }}
          path: data/history/kalshi/
          retention-days: 30
      - name: Commit manifest, team uuids and settled markets (not candles)
        run: |
          git config user.name "nba-edge-bot"
          git config user.email "nba-edge-bot@users.noreply.github.com"
          git add -f data/history/kalshi/MANIFEST.json data/history/kalshi/kalshi_team_uuids.json
          git add -f data/history/kalshi/markets_*.jsonl.gz || true
          git add -f data/history/kalshi/candles_*.jsonl.gz || true
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "history: kalshi settled markets (run ${{ github.run_id }})"
            # Never rewrite the default branch unattended. Merging PR #1 pushed the committed
            # .trigger/* files to main, matched this workflow's `paths:` filter, and fired this
            # pull -- which then committed data straight to main with no review. The trigger files
            # are gone now, but a data pull should refuse this on its own rather than rely on that.
            if [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
              echo "::warning title=Refusing to push to the default branch::Ran on ${GITHUB_REF_NAME}. The data is in this run's workspace/artifact; re-run this workflow on a branch to commit it."
            else
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"  # binary data files: the run's version wins
              git push origin HEAD:"${GITHUB_REF_NAME}"
            fi
          fi
