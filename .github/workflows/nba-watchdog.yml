name: nba-watchdog
# Detects missing or stale NBA pregame work from the ARCHIVES (projection-data + the market capture worker's status), not from a
# workflow's green tick. CRITICAL findings fail this run and open / update the single `nba-ops-alert` issue; a clean run closes it.
# Read-only on every data branch. See research/projection_foundation/nba/live/watchdog.py for the finding codes.
on:
  schedule:
    - cron: "12,42 * * 1-6,10-12 *"
  workflow_dispatch:
    inputs:
      now:
        description: "ISO UTC clock override (replay); blank = wall clock"
        default: ""
  pull_request:
    paths:
      - "research/projection_foundation/nba/live/watchdog.py"
      - "research/projection_foundation/nba/paper/seal_monitor.py"
      - ".github/workflows/nba-watchdog.yml"

permissions:
  contents: read
  issues: write
  actions: read          # Issue #53: the seal chain's run list (dead-man check)

defaults:
  run:
    shell: bash -eo pipefail {0}

env:
  PF_DIR: research/projection_foundation
  PY: "3.13"

concurrency:
  group: nba-watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PY }}" }
      - name: Install (compute stack only)
        run: |
          set -euo pipefail
          pip install -q numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 pyarrow==26.0.0 pydantic==2.13.5 httpx==0.28.1 pyyaml==6.0.1 orjson==3.13.0
          pip install -q -e . --no-deps
      - name: Mount the data branches read-only
        run: bash $PF_DIR/scripts/nba_live_ci.sh mount_ro "$RUNNER_TEMP/m"
      - name: Seal-chain dead-man inputs (Issue #53; best effort - never blocks the existing checks)
        id: seal
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash $PF_DIR/scripts/exec_seal_ci.sh mount_seals "$RUNNER_TEMP/seals"
          bash $PF_DIR/scripts/exec_seal_ci.sh mount_seals "$RUNNER_TEMP/seals_t60a" exec-shadow-seals-t60a || echo "::notice::t60a ledger not mountable (expected until the lane is activated)"
          gh run list --workflow exec-shadow-seal.yml --limit 20 --json databaseId,status,conclusion,event,createdAt,updatedAt > "$RUNNER_TEMP/seal_runs.json" || echo "::warning::could not list exec-shadow-seal runs"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Watchdog
        id: wd
        working-directory: research/projection_foundation
        env:
          NOW: ${{ github.event.inputs.now }}
          SEAL_OK: ${{ steps.seal.outputs.ok }}
        run: |
          set +e
          SEAL_ARGS=""
          if [ "$SEAL_OK" = true ]; then SEAL_ARGS="--seals $RUNNER_TEMP/seals --seal-runs $RUNNER_TEMP/seal_runs.json"; [ -d "$RUNNER_TEMP/seals_t60a" ] && SEAL_ARGS="$SEAL_ARGS --seals-t60a $RUNNER_TEMP/seals_t60a"; fi
          python -m nba.live.watchdog --archive "$RUNNER_TEMP/m/projection-data" --context "$RUNNER_TEMP/m/data-archive" $SEAL_ARGS \
            ${NOW:+--now "$NOW"} --out "$RUNNER_TEMP/health.json" --md "$RUNNER_TEMP/health.md" --expect-paper
          rc=$?
          cat "$RUNNER_TEMP/health.md" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open / update / close the alert issue
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          HEALTH: ${{ runner.temp }}/health.json
          MD: ${{ runner.temp }}/health.md
        with:
          script: |
            const fs = require('fs');
            const rep = JSON.parse(fs.readFileSync(process.env.HEALTH, 'utf8'));
            const body = fs.readFileSync(process.env.MD, 'utf8') + `\n_run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`;
            const label = 'nba-ops-alert';
            try { await github.rest.issues.getLabel({...context.repo, name: label}); }
            catch (e) { await github.rest.issues.createLabel({...context.repo, name: label, color: 'd73a4a', description: 'NBA research pipeline missing/stale work'}); }
            const open = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: label, per_page: 5});
            const cur = open.data[0];
            if (rep.status === 'OK') {
              if (cur) {
                await github.rest.issues.createComment({...context.repo, issue_number: cur.number, body: 'Recovered: no findings.\n\n' + body});
                await github.rest.issues.update({...context.repo, issue_number: cur.number, state: 'closed', state_reason: 'completed'});
              }
              return;
            }
            if (cur) {
              await github.rest.issues.update({...context.repo, issue_number: cur.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title: `NBA ops alert: ${rep.status}`, body, labels: [label]});
            }
      - name: Fail on CRITICAL findings
        if: steps.wd.outputs.rc != '0'
        run: |
          echo "::error::watchdog reported CRITICAL findings (see the summary)"
          exit 1
