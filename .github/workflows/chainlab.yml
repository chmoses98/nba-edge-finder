name: chainlab
# A disposable experiment rig. It exists to answer, with evidence rather than assumption, the
# questions the self-renewing capture worker depends on:
#   1. Can a run dispatch its own successor using GITHUB_TOKEN, or does GitHub's recursion
#      suppression kill the chain? (The whole design hinges on this.)
#   2. What does `concurrency` do to a successor that is queued while its parent still holds the
#      group -- and what happens when a watchdog queues a third run on top of that?
#   3. Does GITHUB_TOKEN stay valid for the whole of a long job?
#   4. If a worker dies before dispatching a successor, does the chain recover?
# It is NOT part of the capture path and must be deleted once its findings are recorded.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "chain | hold | crash | probe"
        default: "probe"
      depth:
        description: "current link number in the chain"
        default: "1"
      max_depth:
        default: "3"
      hold_seconds:
        description: "occupy the runner (and the concurrency group) this long"
        default: "0"
      group:
        description: "concurrency group suffix; runs sharing it contend"
        default: "free"
      tag:
        description: "free-text label so one experiment's runs can be told from another's"
        default: "untagged"

permissions:
  contents: read
  actions: write

concurrency:
  group: chainlab-${{ inputs.group }}
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Facts about this runner and this run
        run: |
          echo "LAB tag=${{ inputs.tag }} mode=${{ inputs.mode }} depth=${{ inputs.depth }} group=${{ inputs.group }}"
          echo "LAB run_id=${{ github.run_id }} attempt=${{ github.run_attempt }} ref=${{ github.ref_name }}"
          echo "LAB started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ) epoch=$(date -u +%s)"
          echo "LAB runner=$(uname -srm) nproc=$(nproc) mem=$(free -m | awk '/Mem:/{print $2}')MB"

      - name: Token works at t=0
        run: |
          code=$(curl -sS -o /tmp/t0.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}")
          echo "LAB token_t0_http=$code"

      # Deliberately BEFORE the successor dispatch, so the parent is still occupying the
      # concurrency group when the successor is queued. That is the real-world ordering: a capture
      # worker dispatches its successor while it is still alive.
      - name: Hold the runner (and the concurrency group)
        if: inputs.hold_seconds != '0'
        run: |
          echo "LAB hold_begin=$(date -u +%s) for ${{ inputs.hold_seconds }}s"
          end=$(( $(date -u +%s) + ${{ inputs.hold_seconds }} ))
          while [ "$(date -u +%s)" -lt "$end" ]; do
            sleep 30
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}")
            echo "LAB token_alive t=$(date -u +%s) elapsed=$(( $(date -u +%s) - ${{ github.run_number }} * 0 )) http=$code"
          done
          echo "LAB hold_end=$(date -u +%s)"

      - name: Die without dispatching a successor
        if: inputs.mode == 'crash'
        run: |
          echo "LAB crashing deliberately; no successor will be dispatched"
          exit 1

      - name: Dispatch successor
        if: inputs.mode == 'chain' || inputs.mode == 'hold'
        run: |
          set -uo pipefail
          next=$(( ${{ inputs.depth }} + 1 ))
          if [ "$next" -gt "${{ inputs.max_depth }}" ]; then
            echo "LAB chain_end depth=${{ inputs.depth }} reached max_depth=${{ inputs.max_depth }}"
            exit 0
          fi
          body=$(printf '{"ref":"%s","inputs":{"mode":"%s","depth":"%s","max_depth":"%s","hold_seconds":"%s","group":"%s","tag":"%s"}}' \
            "${{ github.ref_name }}" "${{ inputs.mode }}" "$next" "${{ inputs.max_depth }}" \
            "${{ inputs.hold_seconds }}" "${{ inputs.group }}" "${{ inputs.tag }}")
          code=$(curl -sS -o /tmp/d.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/chainlab.yml/dispatches" \
            -d "$body")
          echo "LAB dispatch_http=$code depth=${{ inputs.depth }} -> $next at $(date -u +%s)"
          cat /tmp/d.json || true
          # 204 means GitHub ACCEPTED the dispatch. It does NOT prove a run was created -- that is
          # exactly the recursion-suppression question, and it is answered by looking for the
          # successor run, not by trusting this status code.
          [ "$code" = "204" ] || { echo "LAB dispatch_REJECTED"; exit 1; }

      - name: Token still works at the end
        if: always()
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}")
          echo "LAB token_tEnd_http=$code at $(date -u +%s)"
