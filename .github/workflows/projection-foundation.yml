name: projection-foundation
# NBA Projection Foundation, LIVE shadow operation (research/projection_foundation/nba/live). RESEARCH ONLY: authority research_only,
# no staking, no secrets, no paid services, nothing here is read by production. Everything is written to the append-only orphan
# branch `projection-data` (the only branch this workflow writes; see research/projection_foundation/CONTRACT.md section 3).
#
# SCHEDULING (nba/live/schedule_plan.py, the single source of truth; tests/test_schedule_plan.py keeps this file in sync with it):
#   GitHub delivers `schedule` events late (1.5-5 h measured here) and sometimes not at all, so the work is organised in SLOTS (ET
#   instants), not in wall-clock hours. Whatever event arrives works out the most recent slot that is due and RUNS it unless the
#   run ledger on projection-data already holds it. A late event is therefore never a silent skip; a duplicate, backup or DST-alternate
#   firing is an explicit `already_done` skip; a run that fails verification writes no ledger record, so the next backup cron retries
#   the slot. The final `outcome` job fails the workflow on any skip that is not one of the valid reasons, and on any failed job.
#
#   pregame slots 11:20, 13:50, 17:20, 18:20, 19:50, 21:20 ET   capture (official injury-report PDF + ESPN injuries + starters) -> frozen-model
#            projections -> incumbent forecasts -> publish -> results/settle/score of finished games -> ledger -> archive guard -> commit
#   settle slot  06:40 ET                          finals -> outcomes -> settlement -> scorecards -> ledger
#   every slot also has a backup cron 25 minutes later; both UTC hours of every ET target are listed (EDT and EST), the ledger
#   turns the extra firings into no-ops, so the slot clock time never drifts across DST changes.
#   sweep    (hourly 15:50-03:50 UTC)  light: archives the incumbent's pregame capture before tip (nothing is projected)
#   dry run  (pull_request, dispatch dry_run) the whole chain on a temporary COPY of the archive: live fetches, real projections,
#            gate, settle and score; nothing is pushed and no write permission is requested.
# The schedule fires only from the default branch. A manual dispatch is never required: it exists for dry runs and recovery.
on:
  schedule:
    # generated from nba/live/schedule_plan.cron_table() (tests/test_ops_schedule.py fails if this list and the table diverge):
    #   pregame slots 11:20 13:50 17:20 18:20 19:50 21:20 ET, each with a backup cron 25 min later; settle 06:40 ET (+25 min backup);
    #   both UTC hours (EDT, EST) of every ET target are listed; the hourly sweep doubles as a heartbeat for any pregame slot not in the ledger.
    - cron: "15 0,1 * 1-6,10-12 *"
    - cron: "15 18,19 * 1-6,10-12 *"
    - cron: "20 1,2 * 1-6,10-12 *"
    - cron: "20 15,16 * 1-6,10-12 *"
    - cron: "20 21,22 * 1-6,10-12 *"
    - cron: "20 22,23 * 1-6,10-12 *"
    - cron: "45 1,2 * 1-6,10-12 *"
    - cron: "45 15,16 * 1-6,10-12 *"
    - cron: "45 21,22 * 1-6,10-12 *"
    - cron: "45 22,23 * 1-6,10-12 *"
    - cron: "50 0,23 * 1-6,10-12 *"
    - cron: "50 17,18 * 1-6,10-12 *"
    - cron: "40 10,11 * 1-6,10-12 *"
    - cron: "5 11,12 * 1-6,10-12 *"
    - cron: "50 15-23,0-3 * 1-6,10-12 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry run on a temporary copy of the archive (nothing pushed)"
        type: boolean
        default: false
      stage:
        description: "stages (comma separated) or all"
        default: "all"
      season_types:
        description: "regular | preseason | playoffs (comma separated)"
        default: "regular"
      window_hours:
        description: "projection window in hours after now"
        default: "30"
      now:
        description: "dry run only: replay clock (ISO, UTC); blank = wall clock"
        default: ""
      slot:
        description: "make-up run for this slot (YYYY-MM-DD@HHMM, ET); blank = a plain manual run (nba-ticker uses it)"
        default: ""
      slot_kind:
        description: "pregame | settle (with slot)"
        default: ""
  pull_request:
    paths:
      - "research/projection_foundation/**"
      - ".github/workflows/projection-foundation.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

env:
  PF_DIR: research/projection_foundation
  PY: "3.13"
  PIP_PINS: "numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 scikit-learn==1.9.1 lightgbm==4.7.0 pyarrow==26.0.0 pytest==9.1.1 pyyaml==6.0.1 httpx==0.28.1 pypdf==6.17.0 pydantic==2.13.5 orjson==3.13.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.p.outputs.mode }}
      stage: ${{ steps.p.outputs.stage }}
      research_stage: ${{ steps.p.outputs.research_stage }}
      kind: ${{ steps.p.outputs.kind }}
      slot_id: ${{ steps.p.outputs.slot_id }}
      slot_utc: ${{ steps.p.outputs.slot_utc }}
      lateness_min: ${{ steps.p.outputs.lateness_min }}
      reason: ${{ steps.p.outputs.reason }}
      skip_valid: ${{ steps.p.outputs.skip_valid }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PY }}" }
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          DRY: ${{ github.event.inputs.dry_run }}
          STAGE_IN: ${{ github.event.inputs.stage }}
          SLOT_IN: ${{ github.event.inputs.slot }}
          KIND_IN: ${{ github.event.inputs.slot_kind }}
        run: |
          set -euo pipefail
          REF=""
          if git fetch -q --depth=1 origin projection-data 2>/dev/null; then REF=FETCH_HEAD; fi
          cd $PF_DIR
          python -m nba.live.schedule_plan --event "$EVENT" --cron "$CRON" --dry-run "${DRY:-false}" --stage "${STAGE_IN:-all}" \
            --slot "${SLOT_IN:-}" --kind "${KIND_IN:-}" ${REF:+--ledger-ref "$REF"} 2> "$RUNNER_TEMP/plan.json" | tee -a "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/plan.json"
          {
            echo "### plan"
            echo '```json'
            cat "$RUNNER_TEMP/plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------- dry run (no write permission)
  dry-run:
    needs: plan
    if: needs.plan.outputs.mode == 'dry'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: projection-foundation-nba-dry-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PY }}" }
      - name: Install (pinned to the versions the study and these tests ran on)
        run: |
          set -euo pipefail
          pip install -q $PIP_PINS
          pip install -q -e . --no-deps
      - name: Cache the ESPN box-score mirror
        uses: actions/cache@v4
        with:
          path: research/projection_foundation/.cache/hoopr
          key: pf-nba-hoopr-${{ github.run_id }}
          restore-keys: pf-nba-hoopr-
      - name: Mount the data branches (read-only; projection-data becomes a throwaway copy)
        run: |
          set -euo pipefail
          bash $PF_DIR/scripts/nba_live_ci.sh mount "$RUNNER_TEMP/m" dry
      - name: Full chain, dry run (live fetches, real projections, archive into a temp copy, settle and score)
        working-directory: research/projection_foundation
        env:
          PF_WORK: ${{ runner.temp }}/pf_work
        run: |
          set -euo pipefail
          NOW="${{ github.event.inputs.now }}"
          SEASON="${{ github.event.inputs.season_types }}"; SEASON="${SEASON:-regular}"
          WIN="${{ github.event.inputs.window_hours }}"
          # pull requests: a wide window so the dry run always has a real slate to project (before opening night: the 2026-10-20 games)
          if [ -z "$WIN" ]; then if [ "${{ github.event_name }}" = pull_request ]; then WIN=96; else WIN=30; fi; fi
          python -m nba.live.run --stage all --dry-run --archive "$RUNNER_TEMP/m/projection-data" --workdir "$PF_WORK" \
            --shadow "$RUNNER_TEMP/m/shadow" --pit "$RUNNER_TEMP/m/pit" --context "$RUNNER_TEMP/m/data-archive" \
            --season-types "$SEASON" --window-hours "$WIN" ${NOW:+--now "$NOW"}
      - name: PF unit tests (recorded real fixtures; includes the hoopR agreement checks now that the cache is warm)
        working-directory: research/projection_foundation
        run: |
          set -euo pipefail
          python -m pytest tests -q -p no:warnings -x
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-live-dry-run
          path: ${{ runner.temp }}/pf_work
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------------- scheduled pregame / settle
  live:
    needs: plan
    if: needs.plan.outputs.mode == 'pregame' || needs.plan.outputs.mode == 'settle'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    outputs:
      executed: ${{ steps.guard.outputs.proceed }}
      detail: ${{ steps.guard.outputs.detail }}
    concurrency:
      group: projection-foundation-nba
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PY }}" }
      - name: Install
        run: |
          set -euo pipefail
          pip install -q $PIP_PINS
          pip install -q -e . --no-deps
      - name: Cache the ESPN box-score mirror
        uses: actions/cache@v4
        with:
          path: research/projection_foundation/.cache/hoopr
          key: pf-nba-hoopr-${{ github.run_id }}
          restore-keys: pf-nba-hoopr-
      - name: Mount the data branches (creates projection-data as an orphan branch on the first run)
        run: |
          set -euo pipefail
          bash $PF_DIR/scripts/nba_live_ci.sh mount "$RUNNER_TEMP/m" live
      - name: "Slot guard (authoritative re-check after the concurrency queue; a duplicate firing is an explicit skip, never a rewrite)"
        id: guard
        env:
          SLOT_ID: ${{ needs.plan.outputs.slot_id }}
          KIND: ${{ needs.plan.outputs.kind }}
        run: |
          set -euo pipefail
          proceed=true; detail="executing slot $SLOT_ID"
          case "$SLOT_ID" in
            manual-*) ;;
            *) f="$RUNNER_TEMP/m/projection-data/ops/nba/slots/${SLOT_ID%@*}/${SLOT_ID#*@}_${KIND}.json"
               if [ -f "$f" ]; then proceed=false; detail="already_done: $SLOT_ID is in the run ledger (completed while this run was queued)"; fi ;;
          esac
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "$detail"
          echo "### slot guard: proceed=$proceed" >> "$GITHUB_STEP_SUMMARY"; echo "$detail" >> "$GITHUB_STEP_SUMMARY"
      - name: "Pipeline (a failing stage or a failed ledger verification fails the job; nothing is committed after a failure)"
        if: steps.guard.outputs.proceed == 'true'
        working-directory: research/projection_foundation
        env:
          PF_WORK: ${{ runner.temp }}/pf_work
        run: |
          set -euo pipefail
          python -m nba.live.run --stage "${{ needs.plan.outputs.stage }}" --archive "$RUNNER_TEMP/m/projection-data" --workdir "$PF_WORK" \
            --shadow "$RUNNER_TEMP/m/shadow" --pit "$RUNNER_TEMP/m/pit" --context "$RUNNER_TEMP/m/data-archive" \
            --season-types "${{ github.event.inputs.season_types || 'regular' }}" --window-hours "${{ github.event.inputs.window_hours || '30' }}" \
            --slot-id "${{ needs.plan.outputs.slot_id }}" --slot-kind "${{ needs.plan.outputs.kind }}" --slot-utc "${{ needs.plan.outputs.slot_utc }}" \
            --lateness-min "${{ needs.plan.outputs.lateness_min }}" --trigger "${{ github.event_name }}" --cron "${{ github.event.schedule }}" \
            --started-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Kalshi listing audit (reporting only; placeholders are never prices)
        if: steps.guard.outputs.proceed == 'true' && needs.plan.outputs.mode == 'settle'
        continue-on-error: true
        working-directory: research/projection_foundation
        env:
          PF_WORK: ${{ runner.temp }}/pf_work
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 --filter=blob:none origin data-archive
          rm -rf "$RUNNER_TEMP/kalshi"; git -C "$GITHUB_WORKSPACE" worktree add --no-checkout -f "$RUNNER_TEMP/kalshi" origin/data-archive
          git -C "$RUNNER_TEMP/kalshi" sparse-checkout init --no-cone
          D0=$(date -u +%Y-%m-%d); D1=$(date -u -d "1 day ago" +%Y-%m-%d); D2=$(date -u -d "2 days ago" +%Y-%m-%d)
          git -C "$RUNNER_TEMP/kalshi" sparse-checkout set /kalshi/markets/ "/kalshi/markets_delta/dt=$D0/" "/kalshi/markets_delta/dt=$D1/" "/kalshi/markets_delta/dt=$D2/"
          git -C "$RUNNER_TEMP/kalshi" checkout -q
          python -m nba.live.kalshi_report --archive "$RUNNER_TEMP/kalshi" --out "$PF_WORK/kalshi_listing_report.json" > /dev/null
          echo "### Kalshi NBA player-prop listings (reporting only)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); print(json.dumps({k: r[k] for k in ('latest_board','first_board_with_regular_season_props','settlement_rule')}, indent=1)); print(json.dumps(r['latest']['regular_season_total'], indent=1)); print(json.dumps({k: {'markets': v['regular_season_markets'], 'classes': v['regular_season_quote_classes']} for k, v in r['latest']['series'].items()}, indent=1))" "$PF_WORK/kalshi_listing_report.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: "Archive guard on the working tree (additions only), then commit and push the CRITICAL evidence first"
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          (cd $PF_DIR && python -m nba.live.ops_guard "$RUNNER_TEMP/m/projection-data")
          bash $PF_DIR/scripts/nba_live_ci.sh commit_push "$RUNNER_TEMP/m/projection-data"
      - name: "Research stages (paper trading, scorecards, weekly report); a failure fails the job but never touches the committed critical evidence"
        id: research
        if: steps.guard.outputs.proceed == 'true' && needs.plan.outputs.research_stage != ''
        working-directory: research/projection_foundation
        env:
          PF_WORK: ${{ runner.temp }}/pf_work
        run: |
          set -uo pipefail
          python -m nba.live.run --stage "${{ needs.plan.outputs.research_stage }}" --archive "$RUNNER_TEMP/m/projection-data" --workdir "$PF_WORK" \
            --shadow "$RUNNER_TEMP/m/shadow" --context "$RUNNER_TEMP/m/data-archive" \
            --window-hours "${{ github.event.inputs.window_hours || '30' }}"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit and push the research outputs (additions only)
        if: always() && steps.guard.outputs.proceed == 'true' && steps.research.outputs.rc != ''
        run: |
          set -euo pipefail
          (cd $PF_DIR && python -m nba.live.ops_guard "$RUNNER_TEMP/m/projection-data")
          bash $PF_DIR/scripts/nba_live_ci.sh commit_push "$RUNNER_TEMP/m/projection-data"
      - name: Publish the weekly report(s) to a retrievable issue (one issue per week, updated in place)
        if: always() && steps.guard.outputs.proceed == 'true' && needs.plan.outputs.mode == 'settle'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORTS: ${{ runner.temp }}/m/projection-data/reports/nba
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.REPORTS;
            if (!fs.existsSync(dir + '/latest.json')) { core.info('no reports yet'); return; }
            const idx = JSON.parse(fs.readFileSync(dir + '/latest.json', 'utf8'));
            const label = 'nba-report';
            try { await github.rest.issues.getLabel({...context.repo, name: label}); }
            catch (e) { await github.rest.issues.createLabel({...context.repo, name: label, color: '0e8a16', description: 'NBA research weekly report (paper only)'}); }
            for (const [n, w] of Object.entries(idx.weeks)) {
              const md = fs.readFileSync(`${dir}/week${n}/report.md`, 'utf8');
              const head = `**${w.status}** v${w.version} - generated ${w.generated_utc}. Source of truth: branch \`projection-data\`, \`reports/nba/week${n}/\` (report.json, report.md, tables/*.csv, versions/).\n\n`;
              const body = (head + md).slice(0, 60000);
              const title = `NBA research report: week ${n}`;
              const found = await github.rest.issues.listForRepo({...context.repo, state: 'all', labels: label, per_page: 50});
              const cur = found.data.find(i => i.title === title);
              if (cur) { await github.rest.issues.update({...context.repo, issue_number: cur.number, body}); }
              else { await github.rest.issues.create({...context.repo, title, body, labels: [label]}); }
            }
      - name: Fail loudly if a research stage reported a problem
        if: steps.guard.outputs.proceed == 'true' && steps.research.outputs.rc != '' && steps.research.outputs.rc != '0'
        run: |
          echo "::error::research stages exited with code ${{ steps.research.outputs.rc }}: see the pipeline log (the critical evidence was committed first)"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-live-${{ needs.plan.outputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pf_work
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------------- incumbent pregame sweep (light)
  sweep:
    needs: plan
    if: needs.plan.outputs.mode == 'sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: projection-foundation-nba-sweep
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PY }}" }
      - name: Install (compute stack only)
        run: |
          set -euo pipefail
          pip install -q numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 pyarrow==26.0.0 pydantic==2.13.5 httpx==0.28.1 pyyaml==6.0.1 orjson==3.13.0
          pip install -q -e . --no-deps
      - name: Mount the data branches
        run: |
          set -euo pipefail
          bash $PF_DIR/scripts/nba_live_ci.sh mount "$RUNNER_TEMP/m" live
      - name: Archive the incumbent's pregame forecasts that exist now (unchanged, before tip)
        working-directory: research/projection_foundation
        env:
          PF_WORK: ${{ runner.temp }}/pf_work
        run: |
          set -euo pipefail
          python -m nba.live.run --stage incumbent,guard --archive "$RUNNER_TEMP/m/projection-data" --workdir "$PF_WORK" --shadow "$RUNNER_TEMP/m/shadow"
      - name: Commit and push with retries
        run: |
          set -euo pipefail
          bash $PF_DIR/scripts/nba_live_ci.sh commit_push "$RUNNER_TEMP/m/projection-data"

  # ---------------------------------------------------------------------------------------------------- explicit outcome (always runs)
  outcome:
    needs: [plan, dry-run, live, sweep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every stage is EXECUTED, SKIPPED with a valid reason, or FAILED. A skip for any other reason fails the workflow.
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          PLAN_RESULT: ${{ needs.plan.result }}
          REASON: ${{ needs.plan.outputs.reason }}
          SLOT: ${{ needs.plan.outputs.slot_id }}
          LATE: ${{ needs.plan.outputs.lateness_min }}
          R_DRY: ${{ needs.dry-run.result }}
          R_LIVE: ${{ needs.live.result }}
          R_SWEEP: ${{ needs.sweep.result }}
          LIVE_EXECUTED: ${{ needs.live.outputs.executed }}
          LIVE_DETAIL: ${{ needs.live.outputs.detail }}
        run: |
          set -uo pipefail
          rc=0
          row() { echo "| $1 | $2 | $3 |" >> "$GITHUB_STEP_SUMMARY"; }
          { echo "### stage outcomes"; echo; echo "| stage | outcome | detail |"; echo "|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PLAN_RESULT" != success ]; then row plan FAILED "plan job result: $PLAN_RESULT"; echo "::error::plan job $PLAN_RESULT"; exit 1; fi
          row plan EXECUTED "mode=$MODE slot=${SLOT:-n/a} lateness=${LATE:-n/a} min"
          expect() {   # <job label> <result> <mode that should have run it>
            if [ "$MODE" = "$3" ] || { [ "$3" = live ] && { [ "$MODE" = pregame ] || [ "$MODE" = settle ]; }; }; then
              case "$2" in
                success) row "$1" EXECUTED "$4" ;;
                *) row "$1" FAILED "result=$2"; echo "::error::$1 was required by mode=$MODE but its result is $2"; rc=1 ;;
              esac
            else
              case "$2" in
                skipped) row "$1" "SKIPPED (valid)" "not required by mode=$MODE" ;;
                *) row "$1" "UNEXPECTED" "result=$2 under mode=$MODE"; echo "::error::$1 ran under mode=$MODE"; rc=1 ;;
              esac
            fi
          }
          if [ "$MODE" = skip ]; then
            case "$REASON" in
              already_done*) row "all work" "SKIPPED (valid)" "$REASON" ;;
              *) row "all work" "FAILED" "skip for an invalid reason: $REASON"; echo "::error::plan chose to skip for an invalid reason: $REASON"; rc=1 ;;
            esac
          fi
          if [ "$MODE" = pregame ] || [ "$MODE" = settle ]; then
            if [ "$R_LIVE" = success ] && [ "$LIVE_EXECUTED" != true ]; then
              row live "SKIPPED (valid)" "$LIVE_DETAIL"
            else
              expect live "$R_LIVE" live "$MODE slot $SLOT"
            fi
          else
            expect live "$R_LIVE" live ""
          fi
          expect sweep "$R_SWEEP" sweep "incumbent sweep"
          expect dry-run "$R_DRY" dry "dry run on an archive copy"
          exit $rc
