    series_tickers: [KXNBASERIESSPREAD, KXNBASERIESPTSSPREAD, KXNBASERIESTOTALPTS, KXNBASERIESROADWIN, KXNBASERIESROADWINS, KXNBASERIESOT, KXNBASERIESCOMEBACK, KXNBASERIESGCOMEBACK, KXNBA30COMEBACK, KXNBAHOMECLINCH, KXNBAFINBLOWOUT, KXNBAUNBEATEN, KXNBAUPSET, KXNBAPLAYOFFWINS, KXNBAPOLOSE]
