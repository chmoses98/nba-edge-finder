# NBA Kalshi market ontology (curated; discovery reports anything not covered here as UNRESOLVED).
#
# Source of truth for the series universe: data/catalog/discovery_summary.json (300 NBA series at the 2026-10-24 discovery;
# 256 at the original 2026-09-18 build). tests/test_market_coverage.py pins one reviewed sample market per series seen on the
# 2026-10-24 board, so a series cannot silently fall back to UNRESOLVED. Entries added 2026.10.24.1 were each verified against the
# market's own rules_primary/rules_secondary text (see docs/research/NBA_COLLECTION_RELIABILITY_AUDIT_2026-10-24.md section 4).
# Every series ticker observed there maps to a family here, either by exact ticker or by regex pattern
# (`series_patterns`). Exact tickers win over patterns. Series that are NBA-adjacent but not on-court
# basketball outcomes (album releases, ticket prices, viewership, 2K covers...) map to
# `non_basketball_or_offcourt` so they are never UNRESOLVED and never priced.
#
# Support states are CONSERVATIVE and only promoted when the pricing path + tests exist:
#   PRICED      : exactly the 9 core families (game winner/spread/total/team total, player pts/reb/ast/3pt/pra)
#   BUILDABLE   : semantics understood and the one-game simulator emits the quantity; pricing not wired
#   RESEARCH    : semantics understood; needs a model we do not have (season sim, play-by-play, lineups)
#   UNMODELABLE : not a basketball on-court outcome (voting, draft, transactions, business, media)
version: "2026.10.24.1"
families:
  # ------------------------------------------------------------------ game-level, full game (PRICED)
  game_winner:
    scope: game
    stat: winner
    period: FULL
    support: MODELABLE
    description: "Which team wins the game (incl. OT). YES on a team-specific market."
    settlement_notes: "Settles on final score incl. overtime. Postponed games: Kalshi typically extends or voids; treat as UNRESOLVED until market result field says so."
    series_tickers: [KXNBAGAME]
  game_spread:
    scope: game
    stat: margin
    period: FULL
    support: MODELABLE
    description: "Team wins by more than X points (X from floor_strike / yes_sub_title). Includes alternate spreads (one market per line)."
    settlement_notes: "Margin incl. OT. Half-point lines have no push; integer lines: check rules_primary for push handling."
    series_tickers: [KXNBASPREAD]
  game_total:
    scope: game
    stat: total
    period: FULL
    support: MODELABLE
    description: "Combined points over X (incl. OT). Alternate totals are separate markets in the same event."
    settlement_notes: "Total incl. OT."
    series_tickers: [KXNBATOTAL]
  team_total:
    scope: game
    stat: team_total
    period: FULL
    support: MODELABLE
    description: "Single team points over X (incl. OT)."
    settlement_notes: "Team points incl. OT."
    series_tickers: [KXNBATEAMTOTAL]

  # ------------------------------------------------------------------ game-level, period markets (BUILDABLE)
  period_winner:
    scope: game
    stat: winner
    period: PATTERN
    support: BUILDABLE
    description: "Team leads after a specific quarter/half (period from series ticker: KXNBA1Q, KXNBA1H, KXNBA1HWINNER, ...). Quarter/half markets exclude OT."
    settlement_notes: "Ties: consult rules_primary (may settle NO for both or void)."
    series_patterns: ["^KXNBA(1Q|2Q|3Q|4Q|1H|2H)(WINNER|GAME|ML|MONEYLINE)?$"]
  period_spread:
    scope: game
    stat: margin
    period: PATTERN
    support: BUILDABLE
    description: "Period margin threshold (KXNBA1HSPREAD, KXNBA3QSPREAD, ...). Period points only; OT excluded."
    series_patterns: ["^KXNBA(1Q|2Q|3Q|4Q|1H|2H)SPREAD$"]
  period_total:
    scope: game
    stat: total
    period: PATTERN
    support: BUILDABLE
    description: "Period combined points threshold (KXNBA1QTOTAL, KXNBA1HTOTAL, ...). OT excluded."
    series_patterns: ["^KXNBA(1Q|2Q|3Q|4Q|1H|2H)TOTAL$"]
  period_team_total:
    scope: game
    stat: team_total
    period: PATTERN
    support: BUILDABLE
    description: "Period single-team points threshold (KXNBA1QTEAMTOTAL, KXNBA2HTEAMTOTAL, ...). OT excluded."
    series_patterns: ["^KXNBA(1Q|2Q|3Q|4Q|1H|2H)TEAMTOTAL$"]

  # ------------------------------------------------------------------ game-level specials
  game_win_margin:
    scope: game
    stat: margin_bucket
    period: FULL
    support: BUILDABLE
    description: "Winning margin falls in a bucket (e.g. 'Boston by 1-5'). Sim margin distribution gives it directly; bucket parsing not wired."
    series_tickers: [KXNBAWINMARGIN]
  game_overtime:
    scope: game
    stat: overtime
    period: FULL
    support: BUILDABLE
    description: "Game goes to overtime (yes/no). Sim emits regulation tie probability."
    series_tickers: [KXNBAOT, KXNBAOVERTIME]
  game_points_leader:
    scope: game
    stat: pts_leader
    period: FULL
    support: RESEARCH
    description: "Which player scores the most points in the game. Needs joint player-points draw with correlations validated; not built."
    series_tickers: [KXNBAPTSLEADER]
  game_race_to:
    scope: game
    stat: race_to
    period: FULL
    support: RESEARCH
    description: "First team to reach X points. Requires play-by-play (possession-level) simulation."
    series_tickers: [KXNBARACE]
  team_bench_points:
    scope: game
    stat: bench_pts
    period: FULL
    support: BUILDABLE
    description: "Team bench points threshold. Needs starter/bench split from lineup model; sim has per-player points."
    series_tickers: [KXNBABENCHPTS]
  h2h_player_stat:
    scope: player
    stat: h2h
    period: FULL
    support: BUILDABLE
    description: "Player A records more of a stat than player B (points, threes, PRA...). Needs two-entity joint pricing from the same sim draw."
    settlement_notes: "Ties: consult rules_primary."
    series_tickers: [KXNBAH2HPTS, KXNBAH2H3PT, KXNBAH2HPRA]
    series_patterns: ["^KXNBAH2H(PTS|REB|AST|3PT|PRA|PR|PA|RA|STL|BLK|TOV|FTM)$"]
  h2h_team_stat:
    scope: game
    stat: h2h
    period: FULL
    support: BUILDABLE
    description: "Team A records more of a stat than team B (threes, bench points). Needs joint pricing of both teams' stat draws."
    series_tickers: [KXNBAH2HTEAM3PT, KXNBAH2HBENCHPTS]
    series_patterns: ["^KXNBAH2HTEAM"]
  parlay_combo:
    scope: other
    stat: parlay
    period: FULL
    support: BUILDABLE
    description: "Pre-packaged combos / multivariate event contracts (2-3 leg moneyline parlays, MVE single/multi game). Price from joint sim once legs are parsed."
    series_tickers: [KXNBAPREPACK2ML, KXNBAPREPACK3ML, KXMVENBASINGLEGAME, KXMVENBAMULTIGAMEEXTENDED]
    series_patterns: ["^KXNBAPREPACK", "^KXMVENBA"]

  # ------------------------------------------------------------------ player props, single game
  player_points:
    scope: player
    stat: pts
    support: MODELABLE
    description: "Player scores X+ points (threshold from floor_strike/custom_strike/yes_sub_title). Ladder markets share an event."
    settlement_notes: "DNP: typically market resolves NO or void per rules_primary; engine fails closed unless rules parsed."
    series_tickers: [KXNBAPTS, KXNBAPOINTS]
  player_rebounds:
    scope: player
    stat: reb
    support: MODELABLE
    series_tickers: [KXNBAREB, KXNBAREBOUNDS]
  player_assists:
    scope: player
    stat: ast
    support: MODELABLE
    series_tickers: [KXNBAAST, KXNBAASSISTS]
  player_threes:
    scope: player
    stat: fg3m
    support: MODELABLE
    series_tickers: [KXNBA3PT, KXNBATHREES, KXNBA3PM, KXNBA3PTM]
  player_pra:
    scope: player
    stat: pra
    # BUILDABLE, not PRICED: the simulator draws PRA coherently from the same universe as points,
    # rebounds and assists, so the MODEL side is ready -- but the MARKET side is entirely unobserved.
    # The 2025-10-01..2026-07-01 historical pull returned 0 KXNBAPRA markets, and discovery finds
    # 0 in every lifecycle status. Its strike_type, half-line convention, DNP rule and title
    # template are all assumed by analogy to the other player families, never verified against a
    # real market. build_contract would nonetheless return semantics_confidence='high' for the
    # assumed shape, so PRICED meant it would have been priced and settled silently on zero
    # evidence. Promote it the day a real KXNBAPRA market is observed and its semantics proven the
    # way the other eight were.
    support: BUILDABLE
    series_tickers: [KXNBAPRA]
  player_steals:
    scope: player
    stat: stl
    support: BUILDABLE
    series_tickers: [KXNBASTL, KXNBASTEALS]
  player_blocks:
    scope: player
    stat: blk
    support: BUILDABLE
    series_tickers: [KXNBABLK, KXNBABLOCKS]
  player_turnovers:
    scope: player
    stat: tov
    support: BUILDABLE
    series_tickers: [KXNBATOV, KXNBATURNOVERS]
  player_stocks:
    scope: player
    stat: stocks
    support: BUILDABLE
    description: "Steals + blocks combined threshold (Kalshi titles: 'NBA Player Steals + Blocks')."
    series_tickers: [KXNBASTOCK, KXNBASTOCKS]
  player_free_throws:
    scope: player
    stat: ftm
    support: BUILDABLE
    description: "Free throws made threshold."
    series_tickers: [KXNBAFTM]
  player_pr:
    scope: player
    stat: pr
    support: BUILDABLE
    series_tickers: [KXNBAPR]
  player_pa:
    scope: player
    stat: pa
    support: BUILDABLE
    series_tickers: [KXNBAPA]
  player_ra:
    scope: player
    stat: ra
    support: BUILDABLE
    series_tickers: [KXNBARA]
  player_double_double:
    scope: player
    stat: double_double
    support: BUILDABLE
    series_tickers: [KXNBADD, KXNBADOUBLEDOUBLE, KXNBA2D]
  player_triple_double:
    scope: player
    stat: triple_double
    support: BUILDABLE
    series_tickers: [KXNBATD, KXNBATRIPLEDOUBLE, KXNBA3D]
  first_basket:
    scope: player
    stat: first_basket
    support: RESEARCH
    description: "First field goal of the game. Requires opening-tip + first-possession model; not built."
    series_tickers: [KXNBAFIRSTBASKET, KXNBAFB]
  starting_lineup:
    scope: player
    stat: starter
    support: RESEARCH
    description: "Player starts a specific game (often the season opener). Lineup model could price these later; treat as research until the lineup model is validated."
    series_tickers: [KXNBASTARTERS]

