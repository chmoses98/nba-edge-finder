    series_tickers: [KXNBAPTSALLGAMES, KXNBA3PTALLGAMES, KXSHAI20PTREC]
  season_specials:
    scope: season
    stat: special
    period: SEASON
    support: RESEARCH
    description: "Season-long 'any player/game records X' propositions (e.g. any player 70+ points this season)."
    series_tickers: [KXNBAGAMESPECIALS, KXNBAPLAYERSPECIALS, KXNBAFIRST50PTS, KXNBAPLAYERHIGHSCORE, KXNBAGAMEHIGHSCORE, KXNBAONE3PT, KXQUADRUPLEDOUBLE, KXKNUEPPEL3PTREC]

  # ------------------------------------------------------------------ added 2026.10.24.1 (every entry verified from the market's own rules text)
  # "Protected" single-game player props (KXNBA{PTS,REB,AST,3PT}PROT). Same question as the unprotected KXNBAPTS/REB/AST/3PT ladders
  # ("player records N+ in this game") but with a DIFFERENT void rule, so the unprotected distribution must NOT be reused to price them:
  #   - unprotected (KXNBAPTS): inactive, or active but never takes the court -> fair-price refund; once he enters, actual stats.
  #   - protected   (KXNBA*PROT): if he enters in the first half but does NOT enter after halftime (injury, blowout rest, anything --
  #     "injury ... is not required for protection") the contract resolves to the fair price prior to the opening tip, UNLESS he already
  #     reached the threshold, in which case it settles on actual statistics. The rules text is silent on a player who never enters.
  # The refund value (fair price before the opening tip) is not recorded on the contract, so a realised payoff cannot be reconstructed
  # from the archive. RESEARCH until a conditional-on-second-half-participation model and an observed settlement sample exist.
  player_points_protected:
    scope: player
    stat: pts
    support: RESEARCH
    description: "Protected player points threshold for one game (second-half-participation protection)."
    settlement_notes: "Fair-price refund if the player plays only the first half and does not reach the threshold; DNP behaviour not stated in the rules text. Do not price with the unprotected player_points distribution."
    series_tickers: [KXNBAPTSPROT]
  player_rebounds_protected:
    scope: player
    stat: reb
    support: RESEARCH
    description: "Protected player rebounds threshold for one game."
    settlement_notes: "As player_points_protected."
    series_tickers: [KXNBAREBPROT]
  player_assists_protected:
    scope: player
    stat: ast
    support: RESEARCH
    description: "Protected player assists threshold for one game."
    settlement_notes: "As player_points_protected."
    series_tickers: [KXNBAASTPROT]
  player_threes_protected:
    scope: player
    stat: fg3m
    support: RESEARCH
    description: "Protected player made-threes threshold for one game."
    settlement_notes: "As player_points_protected."
    series_tickers: [KXNBA3PTPROT]
  season_player_average:
    scope: player
    stat: season_average
    period: SEASON
    support: RESEARCH
    description: "Regular-season per-game AVERAGE of a stat at or above a threshold (KXNBASTATAVG, e.g. '3.6+ 3PG'). Settles on the rounded figure reported by the Source Agencies; league minimum-games thresholds do not apply and a player with no games is deemed to average zero."
    settlement_notes: "Season-long; needs a season-simulation of games played x per-game rate. Not an on-court single-game quantity."
    series_tickers: [KXNBASTATAVG]
  finals_outcome:
    scope: season
    stat: finals_outcome
    period: SEASON
    support: RESEARCH
    description: "Exact Finals matchup AND winner ('Atlanta beats Denver'); resolves No if either team is eliminated from its specified role."
    series_tickers: [KXNBAFINALSOUTCOME]
  h2h_team_wins:
    scope: season
    stat: h2h_wins
    period: SEASON
    support: RESEARCH
    description: "Team A records more regular-season wins than team B; an exact tie settles all markets 50/50. NOT a single-game market."
    series_tickers: [KXNBAH2HWINS]

  # ------------------------------------------------------------------ summer league (not NBA regular season; excluded from training)
  summer_league_game:
