  draft:
    scope: other
    stat: draft
    period: SEASON
    support: UNMODELABLE
    description: "Draft position, lottery, draft-night trades and draft category propositions."
    series_tickers: [KXNBADRAFT, KXNBADRAFTPICK, KXNBADRAFT1, KXNBADRAFT2, KXNBADRAFT3, KXNBADRAFT4, KXNBADRAFT5, KXNBADRAFT6, KXNBADRAFT7, KXNBADRAFT8, KXNBADRAFT9, KXNBADRAFT10, KXNBADRAFTCAT, KXNBADRAFTCOMP, KXNBADRAFTCONF, KXNBADRAFTINT, KXNBADRAFTMATCHUP, KXNBADRAFTOU, KXNBADRAFTTEAM, KXNBADRAFTTOP, KXNBADRAFTTOP5, KXNBADRAFTTOP10, KXNBADRAFTTOP15, KXNBADRAFTTOP20, KXNBADRAFTTOP25, KXNBADRAFTTOP30, KXNBADRAFTTRADE, KXTOP3NBADRAFT, KXFIRSTPICKNBA, KXNBATOPPICK, KXNBALOTTERY, KXNBALOTTERYODDS, KXNBAPICKTRADE, KXNBATOP3]
    series_patterns: ["^KXNBADRAFT", "^KXNBALOTTERY"]
  transactions:
